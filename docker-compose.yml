# Docker is a development/testing convenience only — see README. Production
# deployment on the mini PC runs natively on Windows (Node.js + a native
# Caddy binary via Task Scheduler) to avoid Docker Desktop/WSL2's memory
# overhead; see scripts/server/ and the "Windows mini-PC deployment" section
# of the README for that path.
services:
  choresome:
    build: .
    image: choresome:latest
    container_name: choresome
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: "file:/app/data/choresome.db"
      SEED_DEMO_DATA: "false"
    volumes:
      # Persistent data lives on the host, outside the disposable container.
      - ./data:/app/data
      - ./backups:/app/backups
