<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Choresome — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #1c1a18;
        color: #f1ece6;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      main { padding: 2rem; max-width: 22rem; }
      .icon { font-size: 3.5rem; }
      h1 { font-size: 1.4rem; margin: 0.75rem 0 0.5rem; }
      p { color: #b3a99d; line-height: 1.5; }
      button {
        margin-top: 1.5rem;
        border: none;
        border-radius: 999px;
        background: #3e8e7e;
        color: white;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.75rem 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">🧺</div>
      <h1>Can&rsquo;t reach Choresome</h1>
      <p>This device can&rsquo;t reach the household server right now. Check that it&rsquo;s connected to the home Wi-Fi and the mini PC is running, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
